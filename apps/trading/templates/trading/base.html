{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Trade Journal{% endblock %} | AA MarketResearch</title>
    <link rel="stylesheet" href="{% static 'market/site.css' %}">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #20252b; }
        nav { background: #101828; padding: 13px 24px; display: flex; gap: 20px; align-items: center; }
        nav strong { color: white; margin-right: auto; } nav a { color: #d0d5dd; text-decoration: none; }
        .container { max-width: 1200px; margin: auto; padding: 24px; }
        .panel { background: white; border-radius: 10px; padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .button, button { display: inline-block; border: 0; border-radius: 6px; padding: 10px 16px; background: #175cd3; color: white; text-decoration: none; font-weight: 700; cursor: pointer; }
        .button.secondary { background: #eaecf0; color: #344054; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; }
        .metric { padding: 14px; border: 1px solid #eaecf0; border-radius: 8px; }
        .metric small { display: block; color: #667085; margin-bottom: 5px; } .metric strong { font-size: 18px; }
        label { display: block; color: #475467; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
        input, select, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d0d5dd; border-radius: 6px; padding: 9px; background: white; }
        .helptext { color: #667085; font-size: 12px; } .errorlist { color: #b42318; margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eaecf0; }
        th { color: #475467; background: #f9fafb; } .positive { color: #027a48; } .negative { color: #b42318; }
        .message { background: #ecfdf3; color: #027a48; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .muted { color: #667085; } .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
        code { word-break: break-all; font-size: 11px; }
        @media (max-width: 700px) { .container { padding: 12px; } .grid { grid-template-columns: 1fr; } nav { padding: 12px; gap: 12px; } }
    </style>
</head>
<body>
{% include "partials/site_nav.html" %}
<main class="container">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
